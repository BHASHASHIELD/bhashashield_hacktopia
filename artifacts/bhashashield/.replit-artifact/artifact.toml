kind = "web"
previewPath = "/"
title = "BhashaShield 2.0"
description = "A privacy-first multilingual voice-fraud protection dashboard that combines caller trust, conversation intent, user context, behaviour, and voice authenticity into explainable risk decisions."
version = "1.0.0"
id = "artifacts/bhashashield"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22904

[services.development]
run = "pnpm --filter @workspace/bhashashield run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/bhashashield", "run", "build" ]
serve = "static"
publicDir = "artifacts/bhashashield/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22904"
BASE_PATH = "/"
